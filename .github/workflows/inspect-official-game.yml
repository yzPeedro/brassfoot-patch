name: Research official Brasfoot 22-23 year selector
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-official-game.yml'
      - 'tools/inspect_career_years.py'
      - 'tools/patch_official_career_year.py'
      - 'tests/test_patch_official_career_year.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch unmodified setup from developer's official website (private CI temp only)
        run: |
          mkdir -p /tmp/brasfoot-official
          curl --fail --location --silent --show-error --max-time 90             --retry 2 --retry-delay 4             -o /tmp/brasfoot-official/brasfoot22-23.exe             https://www.brasfoot.com/download22/brasfoot22-23.exe
          test $(stat -c %s /tmp/brasfoot-official/brasfoot22-23.exe) -gt 5000000
          file /tmp/brasfoot-official/brasfoot22-23.exe
          sha256sum /tmp/brasfoot-official/brasfoot22-23.exe
      - name: Inspect the container read-only; never execute game installer
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('/tmp/brasfoot-official/brasfoot22-23.exe')
          data=p.read_bytes()
          needles=(b'2023',b'2024',b'2026',b'\x07\xe7',b'\x07\xe8',b'\xca\xfe\xba\xbe',b'PK\x03\x04')
          print('SIZE',len(data),'SHA256',hashlib.sha256(data).hexdigest())
          for x in needles:
              print('BYTE_PATTERN',x.hex(),'COUNT',data.count(x))
          print('PE_HEADER',data[:2].hex())
          PY
      - name: List archive content without executing the installer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null
          7z l /tmp/brasfoot-official/brasfoot22-23.exe | tail -n 55
          mkdir -p /tmp/brasfoot-extracted
          7z x -y -o/tmp/brasfoot-extracted /tmp/brasfoot-official/brasfoot22-23.exe >/dev/null || true
          echo "----- Extracted filenames (no file bytes) -----"
          find /tmp/brasfoot-extracted -type f -printf '%P\n' | head -n 100
          find /tmp/brasfoot-extracted -type f \( -iname '*.exe' -o -iname '*.jar' -o -iname '*.class' \) -printf '%P\n' | head -n 60
      - name: Identify largest extracted file types and runtime executable names
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import subprocess
          root=Path('/tmp/brasfoot-extracted')
          files=[p for p in root.rglob('*') if p.is_file()]
          print('EXTRACTED_FILE_COUNT',len(files))
          print('EXTENSION_TOP',Counter(p.suffix.lower() or '<none>' for p in files).most_common(20))
          top=sorted(files,key=lambda p:p.stat().st_size,reverse=True)[:50]
          for p in top:
              print('LARGEST',p.relative_to(root),p.stat().st_size,
                    subprocess.run(['file','-b',str(p)],capture_output=True,text=True).stdout.strip()[:110])
          PY
      - name: Identify class candidates related to year 2023 and 2024
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'.')
          from tools.inspect_career_years import inspect_jar
          root=Path('/tmp/brasfoot-extracted')
          archives=list(root.rglob('*.jar'))+list(root.rglob('*.exe'))
          print('EXTRACTED_JARS_AND_PE_FILES',len(archives))
          for p in archives[:30]:
              report=inspect_jar(p)
              print('ARCHIVE',p.relative_to(root),'CLASSES',report['classFilesExamined'],
                    'CANDIDATES',report['candidateClasses'][:75], 'WARNING',report['warning'])
          PY
      - name: Check packed game executable ZIP entries without modification
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('/tmp/brasfoot-extracted/bf22-23.exe')
          if not zipfile.is_zipfile(p):
              print('Game executable does not contain readable zip structures')
          else:
              with zipfile.ZipFile(p) as z:
                  names=z.namelist()
                  print('EMBEDDED_ZIP_ENTRIES',len(names))
                  print('JAVA_CLASS_FILES',sum(name.endswith('.class') for name in names))
                  print('SUSPECTED_YEAR_DIVISION_CLASSES',
                      [name for name in names if name.endswith('.class') and
                       any(word in name.lower() for word in ('season','ano','division','divisao','inicio','career','carreira','liga','camp'))][:150])
                  print('PREVIEW_ENTRY_NAMES',names[:28])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect only relevant year constants in four class bytecode listings
        run: |
          python - <<'PY'
          import subprocess, zipfile
          from pathlib import Path
          path=Path('/tmp/brasfoot-extracted/bf22-23.exe')
          candidates=('best/aq.class','best/p.class','a/eg.class','a/hU.class',
                      'est/LoadLigaOptions.class','est/ConfigLigaType.class')
          temporary=Path('/tmp/brasfoot-bytecode')
          temporary.mkdir(exist_ok=True)
          with zipfile.ZipFile(path) as z:
              for name in candidates:
                  if name not in z.namelist():continue
                  output=temporary/name
                  output.parent.mkdir(parents=True,exist_ok=True)
                  output.write_bytes(z.read(name))
                  process=subprocess.run(['javap','-c','-p','-constants',str(output)],
                      capture_output=True,text=True,timeout=30)
                  if process.returncode!=0:
                      print('FAILED_JAVAP',name,process.stderr[:400])
                      continue
                  lines=process.stdout.splitlines()
                  matches=[i for i,line in enumerate(lines) if any(x in line for x in (
                      '2023','2024','2026','javax/swing/JComboBox','javax/swing/DefaultComboBoxModel',
                      'getSelectedItem','setSelectedItem','addItem','a1_div','ano','Year'))]
                  print('BYTECODE_CLASS',name,'LINES',len(lines),'MATCHES',len(matches))
                  seen=set()
                  for i in matches[:25]:
                      for j in range(max(0,i-8),min(len(lines),i+9)):
                          if j not in seen:
                              print(f'  {j}: {lines[j][:155]}')
                              seen.add(j)
          PY
      - name: Record installed official Java class source fingerprints
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import zipfile
          archive=Path('/tmp/brasfoot-extracted/bf22-23.exe')
          with zipfile.ZipFile(archive) as source:
              for name in ('a/hU.class','best/f.class','best/p.class'):
                  data=source.read(name)
                  print('CLASS_FINGERPRINT',name,len(data),hashlib.sha256(data).hexdigest())
          PY
      - name: Locate hardcoded national club division arrays in original Java bytecode
        run: |
          python - <<'PY'
          import zipfile,subprocess
          from pathlib import Path
          with zipfile.ZipFile('/tmp/brasfoot-extracted/bf22-23.exe') as z:
              root=Path('/tmp/brasfoot-referenced')
              root.mkdir(exist_ok=True)
              for name in ['best/aq.class','a/hU.class']:
                  p=root/name
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(z.read(name))
                  proc=subprocess.run(['javap','-c','-p',str(p)],capture_output=True,text=True,timeout=35)
                  rows=proc.stdout.splitlines()
                  relevant=[i for i,v in enumerate(rows) if
                      any(term in v.lower() for term in (
                        'string atletico', 'string bragantino_bra','string americamg',
                        'string botafogo', 'string avai', 'string bahi','string criciuma',
                        'string corinthians', 'string abc', 'string saobernardo',
                        'field ar','getselectedindex','method best/aq.am:'))]
                  print('CLASS',name,'TOTAL_LINES',len(rows),'MATCHES',len(relevant))
                  taken=[]
                  for idx in relevant[:16]:
                      if any(abs(idx-prev)<24 for prev in taken):continue
                      taken.append(idx)
                      print('SNIPPET',name,'LINE',idx)
                      for line in rows[max(0,idx-8):min(len(rows),idx+14)]:
                          print(' ',line[:170])
          PY
      - name: Run synthetic 2026-only selector and engine-year regression
        run: python -m unittest discover -s tests -p 'test_patch_official_career_year.py' -v
      - name: Experimentally rewrite only the known official year class to 2026
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('/tmp/brasfoot-extracted/bf22-23.exe')
          with zipfile.ZipFile(src) as jar:
              content=jar.read('a/hU.class')
          p=Path('/tmp/brasfoot-experimental/a/hU.class')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(content)
          PY
          python tools/patch_official_career_year.py \
            --original-class /tmp/brasfoot-experimental/a/hU.class \
            --output-class /tmp/brasfoot-experimental/patched/a/hU.class
          javap -c -p /tmp/brasfoot-experimental/patched/a/hU.class > /tmp/brasfoot-experimental/bytecode.txt
          python - <<'PY'
          from pathlib import Path
          source=Path('/tmp/brasfoot-experimental/bytecode.txt').read_text()
          m=source.split('private void mQ();',1)[1].split('\n  private ',1)[0]
          assert '// String 2026' in m
          assert sum('JComboBox.addItem' in line for line in m.splitlines())==1
          assert 'pop' in m
          assert 'setSelectedIndex' in m
          assert source.count('sipush        2026')>=2
          print('PASS structural year-only 2026 selector and engine setter in official Java class')
          print('NOT A GAMEPLAY TEST. Official version is different from the user 2023/2024 installation.')
          PY
          rm -rf /tmp/brasfoot-experimental
      - name: Delete all licensed installer/extracted files
        if: always()
        run: rm -rf /tmp/brasfoot-official /tmp/brasfoot-extracted
