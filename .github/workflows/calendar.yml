name: Transfer windows — due checks only (publication disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brasfoot-window-calendar
  cancel-in-progress: false
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check calendar (no API calls; no release)
        run: python transfer_windows.py
