name: Daily public football catalog

on:
  schedule:
    - cron: '20 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: brasfoot-daily-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore prior trusted source cache and snapshots
        uses: actions/cache/restore@v4
        with:
          path: data/private/daily
          key: daily-football-v1-${{ github.run_id }}
          restore-keys: daily-football-v1-
      - name: Collect and materialize configured sources
        run: python -m tools.daily_update
      - name: Preserve source cache and recovery state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/private/daily
          key: daily-football-v1-${{ github.run_id }}
      - name: Publish coverage digest only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/world-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh daily football catalog coverage [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git fetch origin gh-pages
          git worktree add --detach /tmp/brasfoot-daily-pages origin/gh-pages
          mkdir -p /tmp/brasfoot-daily-pages/data
          cp site/data/world-status.json /tmp/brasfoot-daily-pages/data/world-status.json
          git -C /tmp/brasfoot-daily-pages add data/world-status.json
          if ! git -C /tmp/brasfoot-daily-pages diff --cached --quiet; then
            git -C /tmp/brasfoot-daily-pages commit -m 'data: daily catalog coverage [skip ci]'
            git -C /tmp/brasfoot-daily-pages push origin HEAD:gh-pages
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
      - name: Retain operational snapshot and journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-catalog-${{ github.run_id }}
          path: |
            data/private/daily/snapshot.json
            data/private/daily/journal.jsonl
            site/data/world-status.json
          retention-days: 14
