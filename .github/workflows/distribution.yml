name: Build and publish Mega Patch release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config/edition.json']

permissions:
  contents: write
  pages: write

concurrency:
  group: brasfoot-distribution
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows-installer/go.mod
          cache: false
      - name: Resolve edition
        id: edition
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('config/edition.json'))['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('version=' + version + '\n')
          PY
      - name: Restore or collect source snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/private/daily
          key: daily-football-v1-${{ github.run_id }}
          restore-keys: daily-football-v1-
      - name: Collect catalog for this distribution
        run: python -m tools.daily_update
      - name: Compile distributable artifacts (no test execution)
        run: >-
          python tools/build_distribution.py
          --bundle windows-installer/bundled_release
          --output dist/release
          --source-commit "$GITHUB_SHA"
          --snapshot data/private/daily/snapshot.json
      - name: Publish artifacts then derive site manifest
        run: >-
          python tools/publish_distribution.py --directory dist/release
          --notes docs/releases/v${{ steps.edition.outputs.version }}.md
      - name: Save published manifest and publish site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/distribution.json site/data/release.json site/data/world-status.json
          git diff --cached --quiet || git commit -m 'release: publish Mega Patch distribution metadata [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          python tools/publish_pages.py
      - name: Preserve artifacts for interrupted publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-patch-distribution-${{ steps.edition.outputs.version }}
          path: dist/release
          retention-days: 30
