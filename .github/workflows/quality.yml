name: Quality checks (no API, no publish)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Python
        run: python -m compileall -q api_football_sync.py build_preview.py install_preview.py transfer_windows.py tests
      - name: Offline unit tests (no user game files or API secrets)
        run: python -m unittest discover -s tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static site tests
        run: node site/tests/site.test.js
      - name: Check for tracked credentials
        run: |
          ! git ls-files | grep -Ei '(^|/)(\.env|api-football\.key|\.secrets)(/|$)'
