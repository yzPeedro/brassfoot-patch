name: Verified roster editor and delta regressions
on:
  push:
    branches: [main]
    paths:
      - 'tools/team-roster-editor/**'
      - 'tools/build_team_delta.py'
      - 'tests/test_team_delta.py'
      - 'tools/audit_roster_readiness.py'
      - 'tests/test_roster_readiness.py'
      - 'site/data/researched-rosters-2026.json'
      - '.github/workflows/roster-editor-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Java editor without external binaries
        run: |
          mkdir -p /tmp/bf-roster-classes
          javac -encoding UTF-8 -d /tmp/bf-roster-classes tools/team-roster-editor/src/e/*.java tools/team-roster-editor/src/app/*.java
      - name: Verify original-file immutability and guard estimated attributes
        run: java -cp /tmp/bf-roster-classes app.RosterEditorSelfTest
      - name: Validate official Criciúma source list
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename,expected in (
              ('criciuma-2026-official.tsv', [3,3,7,8,8]),
              ('londrina-2026-official.tsv', [4,3,6,7,9]),
          ):
              source=Path('tools/team-roster-editor/sources')/filename
              rows=[line.split('\t') for line in source.read_text(encoding='utf-8').splitlines() if line and not line.startswith('#')]
              assert len(rows)==29,(filename,len(rows))
              assert [sum(row[1]==str(pos) for row in rows) for pos in range(5)]==expected,filename
              assert len({row[0] for row in rows})==29
              assert all(len(row)==4 and not row[2] and not row[3] for row in rows)
              print('PASS:',filename,'29 players; verified positions, no invented ages/countries')
          PY
      - name: Verify synthetic byte-differential reconstruction and SHA
        run: python -m unittest discover -s tests -p 'test_team_delta.py' -v
      - name: Audit research against release-readiness gates
        run: |
          python -m unittest discover -s tests -p 'test_roster_readiness.py' -v
          python tools/audit_roster_readiness.py
