name: Verified roster editor and delta regressions
on:
  push:
    branches: [main]
    paths:
      - 'tools/team-roster-editor/**'
      - 'tools/build_team_delta.py'
      - 'tests/test_team_delta.py'
      - 'tools/audit_roster_readiness.py'
      - 'tools/build_abc_team_map.py'
      - 'tools/audit_official_roster_tsv.py'
      - 'tests/test_official_roster_tsv.py'
      - 'tests/test_abc_team_map.py'
      - 'tests/test_roster_readiness.py'
      - 'site/data/researched-rosters-2026.json'
      - '.github/workflows/roster-editor-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Java editor without external binaries
        run: |
          mkdir -p /tmp/bf-roster-classes
          javac -encoding UTF-8 -d /tmp/bf-roster-classes tools/team-roster-editor/src/e/*.java tools/team-roster-editor/src/app/*.java
      - name: Verify original-file immutability and guard estimated attributes
        run: java -cp /tmp/bf-roster-classes app.RosterEditorSelfTest
      - name: Validate official Criciúma source list
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename,expected in (
              ('criciuma-2026-official.tsv', [3,3,7,8,8]),
              ('londrina-2026-official.tsv', [4,3,6,7,9]),
              ('cuiaba-2026-official.tsv', [4,4,4,7,6]),
              ('juventude-2026-official.tsv', [4,8,6,8,10]),
              ('maringa-2026-official.tsv', [4,0,11,10,8]),
              ('avai-2026-official.tsv', [3,5,6,11,11]),
              ('fortaleza-2026-official.tsv', [4,5,6,11,9]),
              ('sport-2026-official.tsv', [4,6,5,10,7]),
              ('ceara-2026-official.tsv', [4,4,6,8,10]),
              ('ituano-2026-official.tsv', [3,5,4,9,8]),
              ('sao-bernardo-2026-official.tsv', [4,5,6,11,11]),
          ):
              source=Path('tools/team-roster-editor/sources')/filename
              rows=[line.split('\t') for line in source.read_text(encoding='utf-8').splitlines() if line and not line.startswith('#')]
              assert len(rows)==sum(expected),(filename,len(rows))
              assert [sum(row[1]==str(pos) for row in rows) for pos in range(5)]==expected,filename
              assert len({row[0] for row in rows})==len(rows)
              assert all(len(row)==4 for row in rows)
              for row in rows:
                  if row[2]: assert 15<=int(row[2])<=49
                  if row[3]: assert 1<=int(row[3])<=250
              if filename=='maringa-2026-official.tsv':
                  assert sum(bool(row[2]) for row in rows)==33
                  assert sum(bool(row[3]) for row in rows)==24
              elif filename=='sao-bernardo-2026-official.tsv':
                  assert sum(bool(row[2]) for row in rows)==37
                  assert all(not row[3] for row in rows)
              else:
                  assert all(not row[2] and not row[3] for row in rows)
              print('PASS:',filename,len(rows),'players; positions verified, no invented ages/countries')
          PY
      - name: Verify synthetic byte-differential reconstruction and SHA
        run: python -m unittest discover -s tests -p 'test_team_delta.py' -v
      - name: Confirm 59 existing A/B/C mappings, one missing Maranhão and no Serie D changes
        run: python -m unittest discover -s tests -p 'test_abc_team_map.py' -v
      - name: Audit 11 sourced real-player lists and exact position counts
        run: python -m unittest discover -s tests -p 'test_official_roster_tsv.py' -v
      - name: Audit research against release-readiness gates
        run: |
          python -m unittest discover -s tests -p 'test_roster_readiness.py' -v
          python tools/audit_roster_readiness.py
